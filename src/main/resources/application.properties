# ---- MongoDB (write model) ----
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=pubmed_write

# ---- Elasticsearch (read model) ----
quarkus.elasticsearch.hosts=localhost:9200
quarkus.elasticsearch.protocol=http

com.pubmedcqrs.read.ArticleProjector/executeBulkWithRetry/Retry/maxRetries=5
com.pubmedcqrs.read.ArticleProjector/executeBulkWithRetry/Retry/delay=1000

# ---- Kafka / Redpanda ----
kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.article-events-out.connector=smallrye-kafka
mp.messaging.outgoing.article-events-out.topic=article-events
mp.messaging.incoming.article-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.article-events-in.dead-letter-queue.topic=article-events-dlq
mp.messaging.incoming.article-events-in.batch=true
mp.messaging.incoming.article-events-in.max.poll.records=100
mp.messaging.incoming.article-events-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.article-events-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.article-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.article-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Canal de entrada: consumido pelo projector que escreve no Elasticsearch
mp.messaging.incoming.article-events-in.connector=smallrye-kafka
mp.messaging.incoming.article-events-in.topic=article-events
mp.messaging.incoming.article-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.article-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.article-events-in.group.id=article-projector
# commit-strategy=throttled -> só avança o offset ap�s o processamento (index no ES) ter sucesso.
# Isso é o que garante a semântica "at-least-once": em caso de crash antes do commit, o Kafka
# reentrega a mensagem, e é aí que a idempotência do consumer (versionamento externo no ES) entra em jogo.
mp.messaging.incoming.article-events-in.commit-strategy=throttled
mp.messaging.incoming.article-events-in.auto.offset.reset=earliest

# ---- Logging util para acompanhar o pipeline durante os testes ----
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/pubmed-import.log
quarkus.log.file.async=true
